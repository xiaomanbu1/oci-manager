# 复制本文件为 config.yaml 后填写
# OCI API 参数获取：控制台右上角头像 → User Settings → API Keys → Add API Key
# 生成后下载私钥，下方 Configuration File Preview 里就有 user/tenancy/fingerprint/region

accounts: []   # 可留空：起服务后到网页「配置」页粘贴 OCI 配置文本 + 上传 PEM
# 也可以在这里静态写死，二选一或混用：
#  - name: tokyo-main
#    user: ocid1.user.oc1..xxx
#    tenancy: ocid1.tenancy.oc1..xxx
#    fingerprint: "aa:bb:cc:dd"
#    region: ap-tokyo-1
#    key_file: ./keys/tokyo.pem

telegram:
  enabled: false
  token: "123456:ABC-your-bot-token"
  admin_ids:
    - 123456789

web:
  enabled: true
  host: 0.0.0.0
  port: 9527
  password: ""                # 公网部署强烈建议设置访问口令
